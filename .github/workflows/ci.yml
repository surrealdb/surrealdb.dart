name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run unit tests
        run: dart test test/cbor test/value test/spectron

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:latest \
            start --user root --pass root --bind 0.0.0.0:8000 memory
      - name: Wait for SurrealDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          echo "SurrealDB did not become healthy" && exit 1
      - name: Run integration tests
        env:
          SURREAL_INTEGRATION: '1'
        run: dart test test/integration
