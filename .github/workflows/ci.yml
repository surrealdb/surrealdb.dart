name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      # Every test directory except the integration tests, which need a
      # server and run in the job below. Tests that need dart:io are marked
      # @TestOn('vm') and skipped on the web.
      # The shared CBOR vectors from surrealdb-protocol, which are fetched
      # rather than committed.
      - name: Fetch the conformance vectors
        run: tool/fetch_conformance_vectors.sh
      - name: Run unit tests on the VM
        run: dart test $(ls -d test/*/ | grep -v -e integration -e support)
      - name: Run unit tests on the web
        run: dart test --platform chrome $(ls -d test/*/ | grep -v -e integration -e support)

  integration:
    name: integration (${{ matrix.surrealdb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest 3.x release and the nightly build. Add the 4.x line here
        # once it has a release tag.
        surrealdb: [v3, nightly]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: Install dependencies
        run: dart pub get
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:${{ matrix.surrealdb }} \
            start --user root --pass root --bind 0.0.0.0:8000 memory
      - name: Wait for SurrealDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              curl -s http://127.0.0.1:8000/version && exit 0
            fi
            sleep 1
          done
          echo "SurrealDB did not become healthy" && docker logs surrealdb && exit 1
      - name: Run integration tests
        env:
          SURREAL_INTEGRATION: '1'
        # The test files share one database, so run them one at a time to
        # avoid write conflicts between them.
        run: dart test --concurrency=1 test/integration

  # The shared conformance scenarios from surrealdb-protocol, run through the
  # SDK by tool/conformance_driver.dart. The runner starts its own server for
  # each set of flags a scenario needs.
  conformance:
    name: conformance (${{ matrix.surrealdb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surrealdb: [v3.3.4, nightly]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: surrealdb/surrealdb-protocol
          ref: v0.14.0
          path: surrealdb-protocol
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install surreal
        run: |
          curl -fsSL "https://download.surrealdb.com/${{ matrix.surrealdb }}/surreal-${{ matrix.surrealdb }}.linux-amd64.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "SURREAL_BIN=$RUNNER_TEMP/surreal" >>"$GITHUB_ENV"
      - name: Build the driver
        run: |
          dart pub get
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          dart compile exe -DSDK_VERSION="$version" tool/conformance_driver.dart \
            -o "$RUNNER_TEMP/conformance_driver"
      - name: Run the scenarios
        working-directory: surrealdb-protocol
        # The driver speaks cbor.2 to a server that offers it, which keeps
        # sized numbers sized, so the scenario that expects them widened runs
        # separately over plain cbor.
        env:
          PLAIN_CBOR: query-sized-numbers-widen-over-plain-cbor
        run: |
          bun install --frozen-lockfile
          bun conformance/runner/cli.ts --driver "$RUNNER_TEMP/conformance_driver" \
            --filter "^(?!$PLAIN_CBOR$)" --report "$RUNNER_TEMP/conformance.json"
          CONFORMANCE_CBOR=cbor bun conformance/runner/cli.ts \
            --driver "$RUNNER_TEMP/conformance_driver" \
            --filter "^$PLAIN_CBOR$" --report "$RUNNER_TEMP/conformance-cbor.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ matrix.surrealdb }}
          path: ${{ runner.temp }}/conformance*.json
